<!doctype html>
<html lang="en">
  <head>

    <title>Welcome Banner</title>

      #welcomeBanner {
        background-color: blue;
        color: white;
        padding: 20px;
      }

        background-color: yellow;
        font-weight: bold;
      }

  </body>
</html>
