<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Debugging Example</title>
  </head>
  <body>
    <h2>Debugging Demo</h2>
    <button onclick="showMessage()">Click Me</button>
    <script>
      function showMessage() {
        let name = "Vizhi";
        console.log("Button clicked");
        console.log("User Name: " + name);
        alert("Check Console in DevTools");
      }
    </script>
  </body>
</html>
