<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Video Invite</title>
    <script>
      function videoReady() {
        document.getElementById("message").innerHTML = "Video ready to play";
      }
      window.onbeforeunload = function () {
        return "Are you sure you want to leave?";
      };
    </script>
  </head>
  <body>
    <h2>Promo Video</h2>
    <video width="400" controls oncanplay="videoReady()">
      <source src="sample.mp4" type="video/mp4" />
    </video>
    <p id="message"></p>
  </body>
</html>
