<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Image Gallery</title>
    <style>
      .event-image {
        border: 3px solid black;
        width: 200px;
        height: 150px;
      }
    </style>
  </head>
  <body>
    <table border="1">
      <tr>
        <td>
          <img
            src="https://picsum.photos/200/150?1"
            alt="Event1"
            title="Music Event"
            class="event-image"
          />

          <p>Music Festival</p>
        </td>
        <td>
          <img
            src="https://picsum.photos/200/150?2"
            alt="Event2"
            title="Workshop"
            class="event-image"
          />

          <p>Workshop</p>
        </td>
        <td>
          <img
            src="https://picsum.photos/200/150?3"
            alt="Event3"
            title="Sports"
            class="event-image"
          />

          <p>Sports Meet</p>
        </td>
      </tr>
      <tr>
        <td>
          <img
            src="https://picsum.photos/200/150?4"
            alt="Event4"
            title="Food Fest"
            class="event-image"
          />

          <p>Food Festival</p>
        </td>
        <td>
          <img
            src="https://picsum.photos/200/150?5"
            alt="Event5"
            title="Dance Event"
            class="event-image"
          />

          <p>Dance Event</p>
        </td>
        <td>
          <img
            src="https://picsum.photos/200/150?6"
            alt="Event6"
            title="Art Show"
            class="event-image"
          />
          <p>Art Exhibition</p>
        </td>
      </tr>
    </table>
  </body>
</html>
